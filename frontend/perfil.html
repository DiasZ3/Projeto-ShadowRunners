<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowRunner - Perfil</title>
    <link rel="stylesheet" href="assets/css/perfil.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a href="perfil.html" class="nav-icon active-nav" data-tooltip="Perfil">
        <img src="/Projeto-ShadowRunners/frontend/assets/img/perfil.png" alt="Perfil" />
      </a>
      <a
        href="criar-corrida.html"
        class="nav-icon"
        data-tooltip="Criar corrida"
      >
        <img src="/Projeto-ShadowRunners/frontend/assets/img/server.png" alt="Servidor" />
      </a>

      <div class="logo-container">
        <img src="/Projeto-ShadowRunners/frontend/assets/img/logo.png" alt="ShadowRunner Logo" class="logo" />
      </div>

      <a
        href="configuracao.html"
        class="nav-icon"
        data-tooltip="Criar Corrida"
      >
        <img src="/Projeto-ShadowRunners/frontend/assets/img/config.png" alt="Criar Corrida" />
      </a>
      <div class="nav-icon" data-tooltip="Ver Corridas">
        <a href="index.html">
        <img src="/Projeto-ShadowRunners/frontend/assets/img/list.png" alt="Carteira" />
        </a>
      </div>
    </aside>

    <main class="main-content profile-container">
      <div class="profile-header">
        <div class="profile-avatar">
          <img src="/Projeto-ShadowRunners/frontend/assets/img/perfil.png" alt="Avatar" />
        </div>
        <h1 class="profile-name">seu perfil</h1>
      </div>

      <div class="profile-grid">
        <section class="profile-card info-card">
          <h2>suas informações</h2>

          <div class="info-display-container">
            <div class="info-field">
              <span class="field-label">nome completo</span>
              <div class="field-value">Piloto das Sombras</div>
            </div>

            <div class="info-field">
              <span class="field-label">apelido de corredor</span>
              <div class="field-value">shadow_runner_99</div>
            </div>

            <div class="info-field">
              <span class="field-label">rank atual</span>
              <div class="field-value rank-highlight">classe a</div>
            </div>
          </div>
        </section>

        <section class="profile-card">
          <h2>corridas cadastradas</h2>
        </section>

        <section class="profile-card car-card">
          <h2>seu carro</h2>

          <div class="car-placeholder"></div>
        </section>
      </div>
    </main>
  </body>
</html>
