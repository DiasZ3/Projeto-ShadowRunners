<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowRunner - Criar Corrida</title>
    <link rel="stylesheet" href="../css/criaCorrida.css">
</head>
<body>

    <aside class="sidebar">
        <a href="perfil.html" class="nav-icon"><img src="../assets/perfil.png" alt="Perfil"></a>
        <a href="index.html" class="nav-icon"><img src="../assets/server.png" alt="Servidor"></a>
        
        <div class="logo-container">
            <img src="../assets/logo.png" alt="ShadowRunner Logo" class="logo">
        </div>
        
        <div class="nav-icon active-nav"><img src="../assets/config.png" alt="Configurações"></div>
        <div class="nav-icon"><img src="../assets/list.png" alt="Carteira"></div>
    </aside>

    <main class="main-content form-container">
        <form class="race-form">
            
            <div class="form-grid">
                
                <div class="form-column">
                    <input type="text" placeholder="nome da corrida" class="input-purple" required>
                    <input type="text" placeholder="apelido de criador" class="input-purple" required>
                    <input type="text" placeholder="horário da corrida" class="input-purple" required>
                    
                    <div class="form-block-group">
                        <span class="block-title">local de corrida</span>
                        <div class="inner-block neon-glow">
                            <div class="input-row">
                                <label>início:</label>
                                <input type="text" class="input-light" placeholder="rua, av...">
                            </div>
                            <div class="input-row">
                                <label>chegada:</label>
                                <input type="text" class="input-light" placeholder="destino final...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-column">
                    <div class="form-block-group flex-fill">
                        <span class="block-title">quantidade de corredores</span>
                        <div class="inner-block riders-grid neon-glow">
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="2" checked>
                                <span class="radio-checkmark"></span> 2
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="8">
                                <span class="radio-checkmark"></span> 8
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="3">
                                <span class="radio-checkmark"></span> 3
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="12">
                                <span class="radio-checkmark"></span> 12
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="4">
                                <span class="radio-checkmark"></span> 4
                            </label>
                            <div></div> 
                            <label class="radio-container">
                                <input type="radio" name="corredores" value="6">
                                <span class="radio-checkmark"></span> 6
                            </label>
                        </div>
                    </div>

                    <div class="form-block-group">
                        <div class="inner-block reward-block neon-glow">
                            <div class="reward-header">
                                <label>premiação:</label>
                                <div class="toggle-buttons">
                                    <span class="btn-toggle green active"></span>
                                    <span class="btn-toggle red"></span>
                                </div>
                            </div>
                            <div class="input-row">
                                <label>valor:</label>
                                <input type="text" class="input-light" placeholder="R$ 0,00">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <button type="submit" class="submit-race-btn">criar corrida</button>
            
        </form>
    </main>

</body>
</html>
